[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gather-engine"
version = "2.4.0"
description = "Collect web pages, papers, APIs, PDFs, scans, audio and video into a local corpus where every item records how it arrived."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Zain Dana Harper", email = "zaindharper@gmail.com" }]
keywords = [
    "research", "intake", "ingestion", "provenance", "transcripts", "arxiv", "accountability",
    "ocr", "transcription", "headless-browser", "synthesis", "web-scraping", "ssrf-safe",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]
# Capability backends (wedge 5 parity layer). The core stays zero-dep; these are
# opt-in edges. Missing edge => honest UNVERIFIABLE or stdlib fallback, never a fake.
fast = ["lxml>=5"]          # native-speed parsing (2x on large docs); stdlib is the fallback
browser = ["playwright>=1.4"]  # JS render (needs `playwright install chromium`)
all = ["lxml>=5", "playwright>=1.4"]

[project.scripts]
gather = "gather.cli:main"

[project.urls]
Homepage = "https://harperz9.github.io/gather.html"
Repository = "https://github.com/HarperZ9/gather"
Issues = "https://github.com/HarperZ9/gather/issues"
Changelog = "https://github.com/HarperZ9/gather/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src/gather"]
