name: Release

on:
  push:
    tags: ["v*"]

# Nothing by default; each job names the one permission it needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify the wheel installs and runs clean
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/gather --version
          /tmp/v/bin/python -c "from gather import make_item, digest, verify_digest; it = make_item(kind='document', id='a', title='A', text='x', source='web', ref='a', method='http-get', fetched_at=0.0); assert verify_digest(digest([it]))"
      - name: Verify the vendored helper in the wheel matches its record
        run: |
          python - <<'PY'
          import glob, hashlib, zipfile
          record = dict(reversed(line.split()) for line in open("VENDORED.sha256") if line.strip())
          wheel = zipfile.ZipFile(glob.glob("dist/*.whl")[0])
          data = wheel.read("gather/_vendor/safe_spawn.py")
          assert hashlib.sha256(data).hexdigest() == record["src/gather/_vendor/safe_spawn.py"], "vendored helper drifted"
          PY
      - name: Write checksums and release notes
        run: |
          mkdir release
          (cd dist && sha256sum *.whl *.tar.gz > ../release/SHA256SUMS.txt)
          cat release/SHA256SUMS.txt
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v" " {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > release/notes.md
          test -s release/notes.md || echo "See CHANGELOG.md for ${GITHUB_REF_NAME}." > release/notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/

  publish:
    needs: [build, native-client]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing (OIDC); no API token stored
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true   # a re-run after a partial upload finishes instead of failing

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and attach its files
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v7
        with:
          name: release
          path: release/
      - name: Verify the files match the checksums
        run: (cd dist && sha256sum -c ../release/SHA256SUMS.txt)
      - name: Create the GitHub Release, or refresh its files on a re-run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp release/SHA256SUMS.txt SHA256SUMS.txt
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.whl dist/*.tar.gz SHA256SUMS.txt --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.whl dist/*.tar.gz SHA256SUMS.txt \
              --verify-tag --title "${GITHUB_REF_NAME}" --notes-file release/notes.md
          fi
  native-client:
    name: Qualify and bundle local Windows client tools
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install native build and test tools
        run: python -m pip install pyinstaller==6.21.0 pytest==8.4.2
      - name: Exercise local client boundaries
        run: python -m pytest tests/test_client_profile.py tests/test_client_package.py -q
      - name: Build native client and verify actual stdio
        shell: pwsh
        run: |
          $mode = if ($env:GITHUB_REF.StartsWith('refs/tags/v')) { 'release' } else { 'dev' }
          python scripts/build_client_package.py "$env:RUNNER_TEMP/client-package" --mode $mode --native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: local-client-assets
          path: ${{ runner.temp }}/client-package/artifacts/
          if-no-files-found: error

  attach-client:
    name: Attach checked client packages to the same product release
    needs: [github-release, native-client]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: local-client-assets
          path: client-assets/
      - name: Verify checksums and attach without replacing published bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd client-assets && sha256sum -c CLIENT-SHA256SUMS.txt)
          gh release upload "$GITHUB_REF_NAME" client-assets/*
